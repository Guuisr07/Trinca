<title>Trinca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Flat 2.0: paleta clara e vibrante, sombras chapadas, sem modo escuro */
:root{
  --bg:#F4F9F5; --surface:#FFFFFF; --surface-2:#E9F4EC;
  --ink:#173A2C; --muted:#63836F; --line:#D3E7D9;
  --brass:#F5B82E; --brass-ink:#3B2A05; --brass-soft:#FFF2CF;
  --ok:#22B573; --ok-soft:#DDF7EA;
  --no:#EF5B4C; --no-soft:#FFE5E1;
  --azul:#3FA9F5; --azul-soft:#DFF0FE;
  --shadow:0 2px 0 var(--line);
  --disp:"Bricolage Grotesque",Georgia,serif;
  --body:"Instrument Sans",system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:var(--disp);text-wrap:balance;margin:0;letter-spacing:-.02em}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ---------- topo ---------- */
.topo{position:sticky;top:0;z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:14px;padding:16px 18px 12px}
.marca{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:-.03em;
  display:flex;align-items:center;gap:7px;margin-right:auto}
.marca i{font-style:normal;color:var(--brass)}
.stat{display:flex;align-items:center;gap:5px;font-weight:600;font-size:15px;
  font-variant-numeric:tabular-nums}
.stat .ico{font-size:17px;line-height:1}

/* ---------- trilha ---------- */
.faixa{padding:6px 18px 22px}
.cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
/* --- destaque "continuar" --- */
.destaque{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--brass),
  color-mix(in srgb,var(--brass) 72%,#000));color:var(--brass-ink);border-radius:20px;
  padding:18px 18px 16px;margin-bottom:16px;box-shadow:0 6px 0 color-mix(in srgb,var(--brass) 55%,#000)}
.destaque .cap{color:color-mix(in srgb,var(--brass-ink) 72%,transparent)}
.destaque h2{font-size:22px;margin:5px 0 4px}
.destaque p{margin:0 0 14px;font-size:13.5px;opacity:.85;line-height:1.45}
.destaque .bt{background:var(--brass-ink);color:var(--brass);box-shadow:none;padding:13px;font-size:15px}
.destaque .naipe-marca{position:absolute;right:-14px;top:-22px;font-size:120px;line-height:1;
  opacity:.13;pointer-events:none}
.destaque .icone-licao{position:absolute;right:18px;bottom:16px;font-size:40px;opacity:.9}

/* --- faixa de metas --- */
.metas{display:flex;gap:8px;margin-bottom:22px}
.meta{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:11px 8px;text-align:center}
.meta i{display:block;font-style:normal;font-size:19px;line-height:1;margin-bottom:5px}
.meta b{display:block;font-family:var(--disp);font-size:17px;font-variant-numeric:tabular-nums}
.meta small{color:var(--muted);font-size:10.5px;letter-spacing:.03em}

.cabecalho-trilha{position:relative;overflow:hidden;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;
  padding:16px 18px;margin-bottom:26px;box-shadow:var(--shadow)}
.cabecalho-trilha .naipe-marca{position:absolute;right:-10px;top:-26px;font-size:104px;line-height:1;
  color:var(--brass);opacity:.09;pointer-events:none}
.cabecalho-trilha h2{position:relative}
.cabecalho-trilha h2{font-size:23px;margin:6px 0 6px}
.cabecalho-trilha p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.barra{height:8px;border-radius:99px;background:var(--surface-2);
  border:1px solid var(--line);overflow:hidden;margin-top:14px}
.barra > i{display:block;height:100%;background:var(--brass);
  transition:width .6s cubic-bezier(.2,.9,.2,1)}
.trilha{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
.no{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:8px 0}
.no .bolha{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;
  font-size:30px;background:var(--surface);border:2px solid var(--line);
  box-shadow:0 5px 0 var(--line);transition:transform .12s ease, box-shadow .12s ease}
.no button:active .bolha{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.no.pronta .bolha{background:var(--brass);border-color:transparent;color:var(--brass-ink);
  box-shadow:0 5px 0 color-mix(in srgb,var(--brass) 65%,#000)}
.no.feita .bolha{background:var(--ok);border-color:transparent;color:#fff;
  box-shadow:0 5px 0 color-mix(in srgb,var(--ok) 65%,#000)}
.no.travada .bolha{opacity:.45;filter:grayscale(1)}
.no.travada button{cursor:not-allowed}
.no b{font-size:13.5px;font-weight:600;max-width:190px;text-align:center;line-height:1.35}
.no small{color:var(--muted);font-size:11.5px}
.no.pronta .bolha::after{content:"";position:absolute;width:78px;height:78px;border-radius:50%;
  border:2px solid var(--brass);animation:pulso 2.4s ease-out infinite}
@keyframes pulso{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(1.5);opacity:0}}
.fio{width:3px;height:24px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 12px)}
.desloc-1{transform:translateX(64px)} .desloc-2{transform:translateX(-64px)}
.desloc-3{transform:translateX(34px)} .desloc-4{transform:translateX(-34px)}
.no .xpzinho{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--brass);
  background:var(--brass-soft);border-radius:99px;padding:2px 8px}
.no.travada .xpzinho{color:var(--muted);background:var(--surface-2)}
.fim-trilha{display:flex;flex-direction:column;align-items:center;gap:6px;margin:28px 0 4px;
  color:var(--muted);font-size:12.5px}
.fim-trilha .fichinhas{display:flex;gap:5px}
.fim-trilha .fichinhas i{width:13px;height:13px;border-radius:50%;display:block;
  box-shadow:inset 0 0 0 2.5px #ffffffcc}
.bloco-travado{margin-top:30px;background:var(--surface-2);border:1px dashed var(--line);
  border-radius:18px;padding:18px;text-align:center}
.bloco-travado h3{font-size:18px;margin-bottom:6px}
.bloco-travado p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}

/* ---------- nav ---------- */
.nav{position:sticky;bottom:0;display:flex;background:var(--surface);
  border-top:1px solid var(--line);margin-top:auto}
.nav button{flex:1;padding:11px 0 14px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.nav button span{font-size:20px}
.nav button.on{color:var(--brass)}

/* ---------- ranking ---------- */
.liga{background:linear-gradient(160deg,var(--brass-soft),var(--surface));
  border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;margin-bottom:18px}
.liga .medalha{font-size:44px;line-height:1}
.liga h2{font-size:22px;margin:8px 0 4px}
.liga p{margin:0;color:var(--muted);font-size:13.5px}
.linha{display:flex;align-items:center;gap:13px;padding:12px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.linha.eu{border-color:var(--brass);background:var(--brass-soft)}
.linha .pos{width:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.linha.eu .pos{color:var(--brass)}
.linha .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface-2);font-size:19px;border:1px solid var(--line)}
.linha .nm{flex:1;font-weight:600;font-size:15px}
.linha .xp{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}

/* ---------- perfil ---------- */
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.caixa{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px}
.caixa b{display:block;font-family:var(--disp);font-size:27px;line-height:1.1;
  font-variant-numeric:tabular-nums}
.caixa small{color:var(--muted);font-size:12px}
.conquista{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.conquista.off{opacity:.45}
.conquista span{font-size:24px}
.conquista b{display:block;font-size:14.5px}
.conquista small{color:var(--muted);font-size:12.5px}

/* ---------- lição ---------- */
#licao{display:none;flex-direction:column;min-height:100vh}
#licao.on{display:flex;position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto}
.licao-topo{display:flex;align-items:center;gap:12px;padding:16px 18px 8px}
.sair{font-size:24px;color:var(--muted);line-height:1;padding:0 2px}
.progresso{flex:1;height:14px;border-radius:99px;background:var(--surface-2);
  border:1px solid var(--line);overflow:hidden}
.progresso > i{display:block;height:100%;background:var(--brass);
  transition:width .45s cubic-bezier(.2,.9,.2,1)}
.fichas{display:flex;gap:3px}
.ficha{width:15px;height:15px;border-radius:50%;background:var(--no);
  border:2.5px dashed color-mix(in srgb,var(--no) 55%,#fff);transition:.3s}
.ficha.perdida{background:var(--surface-2);border-color:var(--line);transform:scale(.75)}
.palco{flex:1;padding:22px 18px 150px;animation:entra .32s cubic-bezier(.2,.9,.2,1)}
@keyframes entra{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.palco h2{font-size:25px;margin-bottom:14px}
.palco .ensina{color:var(--ink);font-size:16px;line-height:1.62;margin:0 0 16px}
.palco .ensina em{font-style:normal;background:var(--brass-soft);color:var(--ink);
  padding:1px 5px;border-radius:5px;font-weight:600}
.lista{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:7px}
.lista li{display:flex;gap:11px;align-items:baseline;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14.5px;line-height:1.45}
.lista li i{font-style:normal;font-weight:700;color:var(--brass);font-variant-numeric:tabular-nums;
  min-width:18px}
.pergunta{font-family:var(--disp);font-size:23px;font-weight:700;margin-bottom:18px;line-height:1.25}
.opcoes{display:flex;flex-direction:column;gap:10px}
.opc{width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);
  border-radius:14px;padding:14px 16px;font-size:15.5px;font-weight:500;
  box-shadow:0 3px 0 var(--line);transition:transform .1s,border-color .15s,background .15s}
.opc:hover{border-color:var(--brass)}
.opc:active{transform:translateY(3px);box-shadow:none}
.opc:disabled{cursor:default}
.opc.certa{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok)}
.opc.errada{border-color:var(--no);background:var(--no-soft);box-shadow:0 3px 0 var(--no)}
.opc:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

/* ---------- cartas ---------- */
.mesa{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:16px;text-align:center}
.mesa .cap{display:block;margin-bottom:9px}
.mao{display:flex;gap:6px;justify-content:center}
/* baralho de 4 cores (padrão PokerStars): ♠ grafite, ♥ vermelho, ♦ azul, ♣ verde */
.carta{--cor:#2F3A3C;width:46px;height:64px;border-radius:9px;background:var(--cor);
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:var(--disp);font-weight:800;line-height:1;
  box-shadow:0 3px 0 color-mix(in srgb,var(--cor) 62%,#000);
  animation:vira .35s backwards}
.carta.n-e{--cor:#2F3A3C} .carta.n-c{--cor:#C0392B}
.carta.n-o{--cor:#2A7FD4} .carta.n-p{--cor:#2E8B57}
.carta u{text-decoration:none;font-size:21px}
.carta b{font-size:16px;font-weight:600;opacity:.95}
.carta.mini{width:36px;height:50px;border-radius:7px;box-shadow:0 2px 0 color-mix(in srgb,var(--cor) 62%,#000)}
.carta.mini u{font-size:16px} .carta.mini b{font-size:13px}
.legenda-naipes{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.pilula-naipe{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:99px;
  background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600}
.pilula-naipe i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  color:#fff;font-style:normal;font-size:13px}
@keyframes vira{from{transform:rotateY(85deg) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.opc .mao{justify-content:flex-start;margin-bottom:7px}
.opc .rot{font-size:13.5px;color:var(--muted);font-weight:600}

/* ---------- feedback ---------- */
.feedback{position:fixed;left:0;right:0;bottom:0;background:var(--surface);
  border-top:1px solid var(--line);padding:18px 18px 22px;transform:translateY(105%);
  transition:transform .3s cubic-bezier(.2,.9,.2,1);z-index:9}
.feedback.on{transform:none}
.feedback .titulo{font-family:var(--disp);font-size:19px;font-weight:800;display:flex;
  align-items:center;gap:8px;margin-bottom:5px}
.feedback.bom .titulo{color:var(--ok)} .feedback.ruim .titulo{color:var(--no)}
.feedback p{margin:0 0 14px;font-size:14.5px;line-height:1.55;color:var(--muted)}
.bt{display:block;width:100%;text-align:center;background:var(--brass);color:var(--brass-ink);
  font-weight:700;font-size:16px;letter-spacing:.02em;padding:15px;border-radius:14px;
  box-shadow:0 4px 0 color-mix(in srgb,var(--brass) 60%,#000);transition:transform .1s}
.bt:active{transform:translateY(4px);box-shadow:none}
.bt.fantasma{background:transparent;color:var(--muted);box-shadow:none;border:2px solid var(--line)}
.rodape-fixo{position:fixed;left:0;right:0;bottom:0;padding:16px 18px 22px;
  background:linear-gradient(transparent,var(--bg) 32%);z-index:8}
.rodape-fixo .interno{max-width:520px;margin:0 auto}

/* ---------- fim ---------- */
.fim{text-align:center;padding:40px 20px}
.fim .selo{font-size:64px;animation:sobe .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes sobe{from{transform:scale(.3) rotate(-18deg);opacity:0}to{transform:none;opacity:1}}
.fim h2{font-size:30px;margin:12px 0 8px}
.fim > p{color:var(--muted);margin:0 0 24px;font-size:15px}
.premios{display:flex;gap:10px;justify-content:center;margin-bottom:26px}
.premio{flex:1;max-width:150px;border:2px solid var(--brass);border-radius:16px;overflow:hidden}
.premio .cap{display:block;background:var(--brass);color:var(--brass-ink);padding:5px;font-weight:700}
.premio b{display:block;font-family:var(--disp);font-size:26px;padding:12px 0;
  font-variant-numeric:tabular-nums}
canvas#confete{position:fixed;inset:0;pointer-events:none;z-index:20}
/* ---------- landing ---------- */
#inicio{position:fixed;inset:0;z-index:30;overflow:hidden;
  background:radial-gradient(130% 85% at 50% -5%,#FFFFFF 0%,var(--bg) 45%,#DDF1E4 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
#inicio.saindo{animation:sai .45s cubic-bezier(.5,0,.9,.4) forwards}
@keyframes sai{to{opacity:0;transform:scale(1.06)}}
.chuva{position:absolute;inset:0;pointer-events:none}
.ficha-cai{position:absolute;top:-70px;border-radius:50%;
  animation:cai linear infinite,gira 1.9s linear infinite}
@keyframes cai{from{translate:0 -80px}to{translate:0 112vh}}
@keyframes gira{50%{scale:.16 1}}
.palco-dealer{position:relative;width:100%;flex:1;min-height:270px;
  display:flex;align-items:flex-end;justify-content:center}
/* fundo que roda atrás do Dom */
.raios{position:absolute;left:50%;top:58%;width:min(170vmax,1250px);aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;opacity:.8;
  background:repeating-conic-gradient(from 0deg,#FFFFFF 0 7deg,#E3F4E9 7deg 14deg);
  -webkit-mask-image:radial-gradient(closest-side,#000 26%,transparent 70%);
  mask-image:radial-gradient(closest-side,#000 26%,transparent 70%);
  animation:roda 80s linear infinite}
@keyframes roda{to{rotate:360deg}}
.anel{position:absolute;left:50%;top:58%;width:170px;height:170px;margin:-85px 0 0 -85px;
  border:3px dashed #22B57345;border-radius:50%;animation:anel 6.5s ease-out infinite}
.anel:nth-of-type(2){animation-delay:2.2s} .anel:nth-of-type(3){animation-delay:4.4s}
@keyframes anel{from{scale:.35;opacity:.85}to{scale:3.6;opacity:0}}
.feltro{position:absolute;left:50%;bottom:0;width:170vw;max-width:900px;height:290px;
  transform:translateX(-50%);border-radius:50% 50% 0 0;background:#2FB37A;
  box-shadow:inset 0 6px 0 #ffffff40,inset 0 -30px 0 #26A26B}
.feltro::after{content:"";position:absolute;left:50%;top:26px;width:74%;height:230px;
  transform:translateX(-50%);border-radius:50% 50% 0 0;border:3px dashed #ffffff55;border-bottom:0}
.dealer{position:relative;z-index:2;width:min(320px,78vw);margin-bottom:-8px;
  animation:sobe-dealer .8s .1s cubic-bezier(.2,1.3,.4,1) backwards}
@keyframes sobe-dealer{from{transform:translateY(80px);opacity:0}}
/* Dom em outros lugares do app */
.dom-fala{display:flex;gap:10px;align-items:flex-end;margin:0 0 18px}
.dom-mini{width:74px;flex:none;margin-bottom:-8px}
.balao{position:relative;flex:1;background:var(--surface-2);border-radius:18px;
  padding:13px 16px;font-size:15.5px;line-height:1.55}
.balao::before{content:"";position:absolute;left:-6px;bottom:18px;width:14px;height:14px;
  background:var(--surface-2);rotate:45deg;border-radius:3px}
.balao em{font-style:normal;background:var(--brass-soft);padding:1px 5px;border-radius:5px;font-weight:600}
.assina{display:flex;align-items:center;gap:7px;justify-content:center;
  font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:10px}
.assina .pino{width:26px;height:26px;border-radius:50%;background:var(--surface-2);
  display:grid;place-items:center;overflow:hidden}
.assina .pino svg{width:44px;margin-bottom:-16px}
.hero{position:relative;z-index:3;width:100%;max-width:520px;padding:22px 22px 30px;
  text-align:center;background:var(--surface);border-radius:30px 30px 0 0;
  box-shadow:0 -8px 0 #ffffff,0 -14px 30px #17372b14;
  animation:sobe-hero .6s .3s cubic-bezier(.2,1.2,.4,1) backwards}
@keyframes sobe-hero{from{transform:translateY(90px);opacity:0}}
.hero .naipes{font-size:15px;letter-spacing:.5em;color:var(--brass);margin-bottom:6px}
.hero h1{font-size:clamp(44px,13vw,64px);font-weight:800;line-height:.95;letter-spacing:-.04em}
.hero h1 span{position:relative;display:inline-block}
.hero h1 span::after{content:"";position:absolute;left:-2%;right:-2%;bottom:6px;height:11px;
  background:var(--brass);border-radius:99px;z-index:-1;transform:scaleX(0);transform-origin:left;
  animation:risca .5s .85s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes risca{to{transform:scaleX(1)}}
.hero .tag{margin:12px auto 18px;max-width:330px;color:var(--muted);font-size:15.5px;line-height:1.5}
.selos{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.selo-mini{display:flex;align-items:center;gap:6px;background:var(--surface-2);
  border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:600}
.selo-mini b{color:var(--ink);font-weight:700}
.hero .bt{max-width:340px;margin:0 auto;font-size:17px;padding:17px}
.hero .rodapinho{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
.hero > *{animation:sobe-item .55s cubic-bezier(.2,1.1,.4,1) backwards}
.hero .assina{animation-delay:.45s} .hero h1{animation-delay:.55s}
.hero .tag{animation-delay:.65s} .hero .selos{animation-delay:.72s}
.hero .bt{animation-delay:.8s} .hero .rodapinho{animation-delay:.88s}
@keyframes sobe-item{from{opacity:0;transform:translateY(14px)}}
@media (max-width:400px){.feltro{height:235px}.palco-dealer{min-height:225px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  .hero h1 span::after{transform:scaleX(1)}}

{ id:"x", nome:"Pós-flop", icone:"♣", embreve:true,

const BOTS = [
 {n:"Marina",a:"🦊",x:640},{n:"Caio",a:"🐺",x:520},{n:"Ju",a:"🐱",x:410},
 {n:"Rafa",a:"🐸",x:330},{n:"Bia",a:"🦉",x:260},{n:"Tom",a:"🐻",x:180},
 {n:"Lê",a:"🐧",x:120},{n:"Nando",a:"🦝",x:70},{n:"Duda",a:"🐢",x:30}
];

/* ============ estado ============ */
const $ = s => document.querySelector(s);
const CHAVE = "trinca.v1";
const PADRAO = {xp:0, feitas:{}, acertos:0, erros:0, streak:1, dia:null};
let S = PADRAO;
try { S = Object.assign({}, PADRAO, JSON.parse(localStorage.getItem(CHAVE) || "{}")); } catch(e){}

function salvar(){ try{ localStorage.setItem(CHAVE, JSON.stringify(S)); }catch(e){} }

function marcarDia(){
  const hoje = new Date().toDateString();
  if (S.dia === hoje) return;
  const ontem = new Date(Date.now() - 864e5).toDateString();
  S.streak = (S.dia === ontem) ? S.streak + 1 : 1;
  S.dia = hoje;
}

/* ============ helpers ============ */
const NAIPES = {"♠":{k:"e", nome:"Espadas", cor:"#2F3A3C"}, "♥":{k:"c", nome:"Copas", cor:"#C0392B"},
                "♦":{k:"o", nome:"Ouros",  cor:"#2A7FD4"}, "♣":{k:"p", nome:"Paus",  cor:"#2E8B57"}};
function carta(c, mini){
  const naipe = c.slice(-1), valor = c.slice(0, -1);
  const n = NAIPES[naipe] || NAIPES["♠"];
  return '<div class="carta n-' + n.k + (mini ? " mini" : "") + '"><u>' +
    valor + "</u><b>" + naipe + "</b></div>";
}
function legendaNaipes(){
  return '<div class="legenda-naipes">' + Object.keys(NAIPES).map(s =>
    '<div class="pilula-naipe"><i style="background:' + NAIPES[s].cor + '">' + s + "</i>" +
    NAIPES[s].nome + "</div>").join("") + "</div>";
}
function mao(cs, mini){
  return '<div class="mao">' + cs.map((c,i) =>
    carta(c, mini).replace('class="carta', 'style="animation-delay:' + (i*70) + 'ms" class="carta')
  ).join("") + "</div>";
}
function liberadas(){
  const mapa = {};
  let trilhaAberta = true;
  for (const t of TRILHAS){
    let anterior = true;
    for (const l of t.licoes){
      mapa[l.id] = trilhaAberta && anterior;
      anterior = !!S.feitas[l.id];
    }
    trilhaAberta = trilhaAberta && t.licoes.length > 0 && t.licoes.every(l => S.feitas[l.id]);
  }
  return mapa;
}
function totalLicoes(){ return TRILHAS.reduce((n,t) => n + t.licoes.length, 0); }
function feitasCount(){ return Object.keys(S.feitas).length; }

/* ============ telas ============ */
let aba = "trilha";
function pintarTopo(){ $("#s-xp").textContent = S.xp; $("#s-streak").textContent = S.streak; }

function render(){
  pintarTopo();
  if (aba === "trilha") telaTrilha();
  else if (aba === "ranking") telaRanking();
  else telaPerfil();
}

function proximaLicao(abertas){
  for (const t of TRILHAS)
    for (const l of t.licoes)
      if (abertas[l.id] && !S.feitas[l.id]) return {licao:l, trilha:t};
  return null;
}

function telaTrilha(){
  const abertas = liberadas();
  let html = "";

  const prox = proximaLicao(abertas);
  if (prox){
    const nova = !S.feitas[prox.licao.id];
    html += '<div class="destaque"><span class="naipe-marca">' + prox.trilha.icone + "</span>" +
      '<div class="cap">' + (feitasCount() ? "Continue de onde parou" : "Comece por aqui") + "</div>" +
      "<h2>" + prox.licao.titulo + "</h2>" +
      "<p>" + prox.trilha.nome + " &middot; " + prox.licao.aula.length + " telas de aula e " +
        prox.licao.q.length + " perguntas &middot; +" + (10 + prox.licao.q.length * 2) + " XP possíveis</p>" +
      '<button class="bt" data-licao="' + prox.licao.id + '">' +
        (nova ? "Jogar lição" : "Revisar lição") + "</button>" +
      '<span class="icone-licao">' + prox.licao.icone + "</span></div>";
  }

  html += '<div class="metas">' +
    '<div class="meta"><i>🔥</i><b>' + S.streak + "</b><small>DIAS SEGUIDOS</small></div>" +
    '<div class="meta"><i>🎯</i><b>' + S.xp + "</b><small>XP TOTAL</small></div>" +
    '<div class="meta"><i>🗺️</i><b>' + feitasCount() + "/" + totalLicoes() + "</b><small>LIÇÕES</small></div>" +
    "</div>";

  TRILHAS.forEach((t, ti) => {
    const feitas = t.licoes.filter(l => S.feitas[l.id]).length;
    const pct = t.licoes.length ? Math.round(feitas / t.licoes.length * 100) : 0;
    const travada = t.licoes.length > 0 && !abertas[t.licoes[0].id] && feitas === 0;
    if (t.embreve || (travada && ti > 0)){
      html += '<div class="bloco-travado"><h3>' + t.icone + " " + t.nome + " &middot; em breve</h3><p>" +
        t.desc + "</p></div>";
      return;
    }
    html += '<div class="cabecalho-trilha' + (ti ? '" style="margin-top:34px' : '') + '">' +
      '<span class="naipe-marca">' + t.icone + "</span>" +
      '<div class="cap">Trilha ' + (ti+1) + " &middot; " + feitas + " de " + t.licoes.length +
        (pct === 100 ? " &middot; completa ✓" : "") + "</div>" +
      "<h2>" + t.icone + " " + t.nome + "</h2><p>" + t.desc + "</p>" +
      '<div class="barra"><i style="width:' + pct + '%"></i></div></div>';
    html += '<div class="trilha">';
    t.licoes.forEach((l, i) => {
      const feita = !!S.feitas[l.id];
      const pronta = !feita && abertas[l.id];
      const cls = feita ? "feita" : (pronta ? "pronta" : "travada");
      const desloc = "desloc-" + ((i % 4) + 1);
      if (i) html += '<div class="fio ' + desloc + '"></div>';
      html += '<div class="no ' + cls + " " + desloc + '">' +
        '<button ' + (pronta || feita ? "" : "disabled ") + 'data-licao="' + l.id + '">' +
        '<div class="bolha">' + (feita ? "✓" : (pronta ? l.icone : "🔒")) + "</div></button>" +
        "<b>" + l.titulo + "</b><small>" +
        (feita ? "concluída" : (pronta ? "toque pra jogar" : "bloqueada")) + "</small>" +
        '<span class="xpzinho">' + (feita ? "✓ FEITA" : "+" + (10 + l.q.length * 2) + " XP") +
        "</span></div>";
    });
    html += "</div>";
    html += '<div class="fim-trilha"><div class="fichinhas">' +
      ["#C0392B","#E3B04B","#2A7FD4","#2E8B57"].map(c =>
        '<i style="background:' + c + '"></i>').join("") + "</div>" +
      (pct === 100 ? "Trilha fechada. Boa!" : feitas + " de " + t.licoes.length +
        " lições — falta pouco") + "</div>";
  });
  $("#tela").innerHTML = html;
  $("#tela").querySelectorAll("[data-licao]").forEach(b =>
    b.addEventListener("click", () => abrirLicao(b.dataset.licao)));
}

function telaRanking(){
  const lista = BOTS.concat([{n:"Você", a:"🎩", x:S.xp, eu:true}]).sort((a,b) => b.x - a.x);
  const pos = lista.findIndex(j => j.eu) + 1;
  let html = '<div class="liga"><div class="medalha">🏆</div><h2>Liga das Fichas</h2>' +
    "<p>Você está em <b>" + pos + "º</b> de " + lista.length +
    ". Cada lição vale XP — os 3 primeiros sobem de liga no domingo.</p></div>";
  html += lista.map((j, i) =>
    '<div class="linha' + (j.eu ? " eu" : "") + '"><div class="pos">' + (i+1) + "</div>" +
    '<div class="av">' + j.a + '</div><div class="nm">' + j.n + "</div>" +
    '<div class="xp">' + j.x + " XP</div></div>").join("");
  $("#tela").innerHTML = html;
}

function telaPerfil(){
  const tentativas = S.acertos + S.erros;
  const precisao = tentativas ? Math.round(S.acertos / tentativas * 100) : 0;
  const conq = [
    {i:"🎬", t:"Primeira mão", d:"Concluiu a lição de estreia", ok:feitasCount() >= 1},
    {i:"♠", t:"Fundamentos fechados", d:"Terminou a trilha 1 inteira", ok:TRILHAS[0].licoes.every(l => S.feitas[l.id])},
    {i:"🔥", t:"Três dias seguidos", d:"Voltou 3 dias em sequência", ok:S.streak >= 3},
    {i:"🎯", t:"Mão de ferro", d:"100 XP acumulados", ok:S.xp >= 100}
  ];
  $("#tela").innerHTML =
    '<div class="cap" style="margin-bottom:10px">Seu progresso</div>' +
    '<div class="grade">' +
      '<div class="caixa"><b>' + S.xp + "</b><small>XP total</small></div>" +
      '<div class="caixa"><b>' + S.streak + "</b><small>dias seguidos</small></div>" +
      '<div class="caixa"><b>' + feitasCount() + "/" + totalLicoes() + "</b><small>lições</small></div>" +
      '<div class="caixa"><b>' + precisao + "%</b><small>de acerto</small></div>" +
    "</div>" +
    '<div class="cap" style="margin-bottom:10px">Conquistas</div>' +
    conq.map(c => '<div class="conquista' + (c.ok ? "" : " off") + '"><span>' + c.i +
      "</span><div><b>" + c.t + "</b><small>" + c.d + "</small></div></div>").join("") +
    '<button class="bt fantasma" id="zerar" style="margin-top:18px">Zerar meu progresso</button>';
  $("#zerar").addEventListener("click", () => {
    if (!confirm("Isso apaga XP, lições e sequência. Continuar?")) return;
    S = Object.assign({}, PADRAO, {feitas:{}}); salvar(); render();
  });
}

document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".nav button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); aba = b.dataset.aba; render();
}));

/* ============ lição ============ */
let L = null;

function abrirLicao(id){
  let licao = null;
  TRILHAS.forEach(t => t.licoes.forEach(l => { if (l.id === id) licao = l; }));
  if (!licao) return;
  L = {
    licao: licao,
    passos: licao.aula.map(a => Object.assign({tipo:"aula"}, a))
      .concat(licao.q.map(q => Object.assign({tipo:"q"}, q))),
    i: 0, vidas: 3, deprimeira: 0, total: licao.q.length, errou: false
  };
  $("#licao").classList.add("on");
  document.body.style.overflow = "hidden";
  pintarFichas(); passo();
}

function fecharLicao(){
  $("#licao").classList.remove("on");
  $("#feedback").classList.remove("on", "bom", "ruim");
  document.body.style.overflow = "";
  L = null; render();
}
$("#btn-sair").addEventListener("click", () => {
  if (!L || L.i === 0 || confirm("Sair agora perde o progresso desta lição.")) fecharLicao();
});

function pintarFichas(){
  $("#fichas").innerHTML = [0,1,2].map(i =>
    '<div class="ficha' + (i >= L.vidas ? " perdida" : "") + '"></div>').join("");
}

function passo(){
  const fb = $("#feedback");
  fb.classList.remove("on", "bom", "ruim");
  $("#pg").style.width = Math.round(L.i / L.passos.length * 100) + "%";
  if (L.i >= L.passos.length) return concluir();
  const p = L.passos[L.i];
  const palco = $("#palco"), rodape = $("#rodape").firstElementChild;
  if (p.tipo === "aula"){
    palco.innerHTML = "<h2>" + p.h + "</h2>" +
      (p.p ? '<div class="dom-fala"><svg class="dom-mini" viewBox="0 0 300 260" aria-hidden="true">' +
        '<use href="#dom"/></svg><div class="balao">' + p.p + "</div></div>" : "") +
      (p.naipes ? legendaNaipes() : "") +
      (p.cartas ? '<div class="mesa">' + mao(p.cartas) + "</div>" : "") +
      (p.lista ? '<ul class="lista">' + p.lista.map((li, n) =>
        "<li><i>" + (n+1) + "</i><span>" + li + "</span></li>").join("") + "</ul>" : "");
    palco.style.animation = "none"; void palco.offsetWidth; palco.style.animation = "";
    rodape.innerHTML = '<button class="bt">Entendi</button>';
    rodape.firstElementChild.addEventListener("click", () => { L.i++; passo(); });
    return;
  }
  rodape.innerHTML = "";
  const opcoes = p.t === "mao"
    ? p.o.map((h, n) => '<button class="opc" data-i="' + n + '">' + mao(h, true) +
        '<div class="rot">Jogador ' + (n+1) + "</div></button>").join("")
    : p.o.map((o, n) => '<button class="opc" data-i="' + n + '">' + o + "</button>").join("");
  palco.innerHTML =
    '<div class="cap">Pergunta ' + (L.passos.slice(0, L.i).filter(x => x.tipo === "q").length + 1) + "</div>" +
    '<div class="pergunta">' + p.p + "</div>" +
    (p.board ? '<div class="mesa"><span class="cap">Mesa</span>' + mao(p.board, true) + "</div>" : "") +
    '<div class="opcoes">' + opcoes + "</div>";
  palco.style.animation = "none"; void palco.offsetWidth; palco.style.animation = "";
  palco.querySelectorAll(".opc").forEach(b => b.addEventListener("click", () => responder(b, p)));
}

function responder(botao, p){
  const escolha = +botao.dataset.i, certo = escolha === p.c;
  $("#palco").querySelectorAll(".opc").forEach((b, n) => {
    b.disabled = true;
    if (n === p.c) b.classList.add("certa");
    else if (n === escolha) b.classList.add("errada");
  });
  const fb = $("#feedback");
  if (certo){
    S.acertos++;
    if (!p.repetida) L.deprimeira++;
    fb.classList.add("bom");
    $("#fb-titulo").innerHTML = "✓ Isso aí!";
  } else {
    S.erros++; L.errou = true; L.vidas--; pintarFichas();
    fb.classList.add("ruim");
    $("#fb-titulo").innerHTML = "✗ Quase lá";
    L.passos.push(Object.assign({}, p, {repetida:true}));
  }
  salvar();
  $("#fb-texto").textContent = p.e;
  $("#fb-bt").textContent = L.vidas <= 0 ? "Ver o que aconteceu" : "Continuar";
  requestAnimationFrame(() => fb.classList.add("on"));
}

$("#fb-bt").addEventListener("click", () => {
  if (!L) return;
  if (L.vidas <= 0) return semFichas();
  L.i++; passo();
});

function semFichas(){
  $("#feedback").classList.remove("on", "bom", "ruim");
  $("#pg").style.width = "0%";
  $("#rodape").firstElementChild.innerHTML = "";
  $("#palco").innerHTML =
    '<div class="fim"><div class="selo">🪙</div><h2>Acabaram suas fichas</h2>' +
    "<p>Sem drama: revisar é parte do jogo. Refaça a lição — o conteúdo é o mesmo, " +
    "e da segunda vez ele gruda.</p>" +
    '<button class="bt" id="denovo">Tentar de novo</button>' +
    '<button class="bt fantasma" id="voltar" style="margin-top:10px">Voltar pra trilha</button></div>';
  $("#denovo").addEventListener("click", () => abrirLicao(L.licao.id));
  $("#voltar").addEventListener("click", fecharLicao);
}

function concluir(){
  const bonus = L.deprimeira * 2;
  const ganho = 10 + bonus;
  const nova = !S.feitas[L.licao.id];
  S.feitas[L.licao.id] = true;
  S.xp += ganho;
  marcarDia(); salvar(); pintarTopo();
  $("#pg").style.width = "100%";
  $("#rodape").firstElementChild.innerHTML = "";
  $("#palco").innerHTML =
    '<div class="fim"><div class="selo">' + (L.errou ? "👏" : "🏅") + "</div>" +
    "<h2>" + (L.errou ? "Lição fechada!" : "Sem errar uma!") + "</h2>" +
    "<p>" + L.licao.titulo + (nova ? " desbloqueou a próxima." : " revisada.") + "</p>" +
    '<div class="premios">' +
      '<div class="premio"><span class="cap">XP ganho</span><b>+' + ganho + "</b></div>" +
      '<div class="premio"><span class="cap">De primeira</span><b>' + L.deprimeira + "/" + L.total + "</b></div>" +
    "</div>" +
    '<button class="bt" id="segue">Continuar</button></div>';
  $("#segue").addEventListener("click", fecharLicao);
  confete();
}

/* ============ confete ============ */
function confete(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confete"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cores = ["#B4831F", "#2E8B57", "#C0392B", "#E3B04B", "#F5F7F2"];
  const fichas = Array.from({length:70}, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.5,
    r: 4 + Math.random() * 5, vy: 2 + Math.random() * 3.5, vx: -1 + Math.random() * 2,
    g: Math.random() * 6.28, vg: -0.12 + Math.random() * 0.24,
    c: cores[(Math.random() * cores.length) | 0]
  }));
  let quadros = 0;
  (function anima(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    fichas.forEach(f => {
      f.y += f.vy; f.x += f.vx; f.g += f.vg;
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.g);
      ctx.fillStyle = f.c; ctx.beginPath();
      ctx.ellipse(0, 0, f.r, f.r * Math.abs(Math.cos(f.g)) + 1.5, 0, 0, 6.3);
      ctx.fill(); ctx.restore();
    });
    if (++quadros < 190) requestAnimationFrame(anima);
    else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

/* ============ auto-teste ============ */
(function teste(){
  const abertas = liberadas();
  console.assert(abertas["f1"] === true, "primeira lição deve começar aberta");
  const salvo = JSON.stringify(S.feitas);
  S.feitas = {};
  console.assert(liberadas()["f2"] === false, "f2 travada antes de f1");
  S.feitas = {f1:1};
  console.assert(liberadas()["f2"] === true, "f2 abre depois de f1");
  console.assert(liberadas()["p1"] === false, "trilha 2 só abre com trilha 1 inteira");
  TRILHAS[0].licoes.forEach(l => S.feitas[l.id] = 1);
  console.assert(liberadas()["p1"] === true, "trilha 2 abre com trilha 1 completa");
  S.feitas = JSON.parse(salvo);
  TRILHAS.forEach(t => t.licoes.forEach(l => l.q.forEach(q =>
    console.assert(q.o[q.c] !== undefined, "resposta correta fora do range em " + l.id))));

  /* regra: nenhuma pergunta cobre conteúdo que ainda não foi ensinado */
  const ordem = [];
  TRILHAS.forEach(t => t.licoes.forEach(l => ordem.push(l)));
  const ensinaMesa = ordem.findIndex(l => /comunitárias/.test(JSON.stringify(l.aula)));
  console.assert(ensinaMesa >= 0, "nenhuma lição ensina as cartas comunitárias");
  ordem.forEach((l, i) => {
    console.assert(l.aula.length >= 3, "lição rasa demais: " + l.id);
    l.q.forEach(q => console.assert(!(q.board || q.t === "mao") || i >= ensinaMesa,
      "pergunta usa a mesa antes da aula que a ensina: " + l.id));
  });
})();

/* ============ landing ============ */
(function landing(){
  const cores = ["#EF5B4C","#F5B82E","#3FA9F5","#22B573","#8E6FE0","#FFFFFF"];
  let html = "";
  for (let i = 0; i < 20; i++){
    const t = 24 + Math.random() * 28;
    const c = cores[(Math.random() * cores.length) | 0];
    html += '<div class="ficha-cai" style="' +
      "left:" + (Math.random() * 100).toFixed(1) + "%;" +
      "width:" + t.toFixed(0) + "px;height:" + t.toFixed(0) + "px;background:" + c + ";" +
      "box-shadow:inset 0 0 0 " + (t/10).toFixed(1) + "px #ffffffd9, inset 0 0 0 " +
        (t/6).toFixed(1) + "px " + c + ", 0 3px 0 #00000012;" +
      "animation-duration:" + (5 + Math.random() * 7).toFixed(1) + "s," +
        (1.1 + Math.random() * 1.8).toFixed(1) + "s;" +
      "animation-delay:-" + (Math.random() * 9).toFixed(1) + "s,-" +
        (Math.random() * 2).toFixed(1) + "s;" +
      "opacity:" + (0.45 + Math.random() * 0.45).toFixed(2) + '"></div>';
  }
  $("#chuva").innerHTML = html;

  if (S.xp > 0){
    $("#entrar").textContent = "Continuar de onde parei";
    $("#rodapinho").textContent = S.xp + " XP acumulados · " + feitasCount() +
      " de " + totalLicoes() + " lições feitas";
  }
  document.body.style.overflow = "hidden";
  const dealer = document.querySelector(".dealer");
  $("#entrar").addEventListener("pointerdown", () => {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    dealer.animate([
      {transform:"none"},
      {transform:"translateY(-18px) rotate(-3deg)", offset:.4},
      {transform:"translateY(0) rotate(2.5deg)", offset:.7},
      {transform:"none"}
    ], {duration:550, easing:"cubic-bezier(.2,1.4,.4,1)"});
  });
  $("#entrar").addEventListener("click", () => {
    const tela = $("#inicio");
    tela.classList.add("saindo");
    document.body.style.overflow = "";
    setTimeout(() => tela.remove(), 450);
  });
})();

render();
